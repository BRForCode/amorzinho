<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eu te amo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d0d2b;
      font-family: 'Arial', sans-serif;
      color: white;
      overflow-x: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    .click-button {
      background-color: #8b5cf6;
      color: white;
      border: 2px solid #a78bfa;
      padding: 15px 40px;
      font-size: 22px;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 0 20px #8b5cf6;
      transition: 0.3s;
      z-index: 100;
    }

    .click-button:active { transform: scale(0.95); }

    .hidden { display: none !important; }

    .carousel {
      width: 90vw;
      max-width: 320px;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      position: relative;
      margin: 20px auto;
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(167, 139, 250, 0.4);
      background: #000;
    }

    .carousel img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .carousel img.active { opacity: 1; }

    .text-box {
      max-width: 360px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 15px;
      margin-top: 15px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    #love-time {
      font-size: 1.1rem;
      color: #a78bfa;
      margin: 10px 0;
      font-weight: bold;
    }

    /* Chuva de corações */
    .heart {
      position: fixed;
      top: -20px;
      color: #ff4d4d;
      font-size: 20px;
      user-select: none;
      pointer-events: none;
      z-index: 50;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(105vh) rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="container">
    <button id="btn-start" class="click-button" onclick="startLove()">❤ Clique Aqui</button>
    
    <div id="content" class="hidden">
      <div id="hearts-container"></div>

      <audio id="love-audio" loop>
        <source src="music.mp3" type="audio/mpeg">
      </audio>

      <div class="carousel" id="carousel">
        <img src="img1.jpg" class="active">
        <img src="img2.jpg">
        <img src="img3.jpg">
        <img src="img4.jpg">
        <img src="img5.jpg">
        <img src="img6.jpg">
        <img src="img7.jpg">
        <img src="img8.jpg">
        <img src="img9.jpg">
      </div>

      <div class="text-box">
        <h3>Eu te amo há ❤️:</h3>
        <div id="love-time">Calculando...</div>
        <p style="font-size: 14px; color: #ddd; margin-top: 10px;">
          A cada dia que passa, meu coração se enche mais de carinho por você. 
          Cada sorriso seu ilumina o meu mundo. Eu te amo para sempre! 💜
        </p>
      </div>
    </div>
  </div>

  <script>
    function startLove() {
      // 1. Esconder botão e mostrar conteúdo
      document.getElementById('btn-start').classList.add('hidden');
      document.getElementById('content').classList.remove('hidden');

      // 2. Tentar tocar áudio
      var audio = document.getElementById('love-audio');
      audio.play().catch(function() { 
        console.log("O áudio só toca após interação (alguns navegadores barram).");
      });

      // 3. Iniciar funções
      startCarousel();
      createHearts();
      setInterval(updateLoveTime, 1000);
      updateLoveTime(); 
    }

    function startCarousel() {
      var images = document.querySelectorAll('#carousel img');
      var index = 0;
      if(images.length <= 1) return;
      
      setInterval(function() {
        images[index].classList.remove('active');
        index = (index + 1) % images.length;
        images[index].classList.add('active');
      }, 3000);
    }

    function createHearts() {
      var container = document.getElementById('hearts-container');
      setInterval(function() {
        var heart = document.createElement('div');
        heart.className = 'heart';
        heart.innerHTML = '❤';
        heart.style.left = Math.random() * 100 + 'vw';
        heart.style.fontSize = (Math.random() * 10 + 15) + 'px';
        heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
        heart.style.opacity = Math.random();
        container.appendChild(heart);
        
        setTimeout(function() { heart.remove(); }, 5000);
      }, 300);
    }

    function updateLoveTime() {
      // DATA CORRETA: 26 de Outubro de 2023 às 19:30
      var startDate = new Date(2023, 9, 26, 19, 30, 0); // Meses no JS começam em 0 (Outubro = 9)
      var now = new Date();

      var years = now.getFullYear() - startDate.getFullYear();
      var months = now.getMonth() - startDate.getMonth();
      var days = now.getDate() - startDate.getDate();

      // Ajuste de dias negativos
      if (days < 0) {
        months--;
        var lastDayLastMonth = new Date(now.getFullYear(), now.getMonth(), 0).getDate();
        days += lastDayLastMonth;
      }

      // Ajuste de meses negativos
      if (months < 0) {
        years--;
        months += 12;
      }

      // Horas, Minutos e Segundos
      var diffMs = now - startDate;
      var hours = Math.floor((diffMs / (1000 * 60 * 60)) % 24);
      var minutes = Math.floor((diffMs / (1000 * 60)) % 60);
      var seconds = Math.floor((diffMs / 1000) % 60);

      document.getElementById("love-time").innerHTML = 
        years + " anos, " + months + " meses, " + days + " dias<br>" + 
        hours + "h " + minutes + "m " + seconds + "s";
    }
  </script>
</body>
</html>
